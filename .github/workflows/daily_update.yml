name: Daily Event Update

on:
  schedule:
    # 每天 UTC 03:00 执行（对应 JST 日本时间 12:00）
    - cron: '0 3 * * *'
  workflow_dispatch: # 允许手动在 Actions 页面触发

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交代码回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Browser Binaries (Playwright & Camoufox)
        run: |
          playwright install --with-deps chromium
          python -m camoufox fetch

      - name: Run Scraping and LLM Processing
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          # 验证 Secret 是否存在
          if [ -z "$GOOGLE_APPLICATION_CREDENTIALS_JSON" ]; then
            echo "Error: GOOGLE_APPLICATION_CREDENTIALS_JSON secret is not set."
            exit 1
          fi
          
          # 将环境变量写入临时文件供 SDK 读取
          echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp_key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_key.json
          
          # 执行主程序
          python main.py
          
          # 删除凭证文件
          rm /tmp/gcp_key.json

      - name: Commit and push generated data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 仅添加生成的 JSON 数据文件和更新的 meta.json
          git add docs/data/
          
          # 如果有改动则提交，否则跳过
          if git diff --staged --quiet; then
            echo "No changes to commit (data is up to date)"
          else
            git commit -m "Auto-update event data $(date +'%Y-%m-%d')"
            git push
          fi
